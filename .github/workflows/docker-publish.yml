name: docker-publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Published release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.tag && format('refs/tags/{0}', inputs.tag)) || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.sha }}
          persist-credentials: false
      - name: Read build metadata
        id: build
        run: |
          {
            echo "version=$(cat VERSION)"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: workflow
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag || github.event.release.tag_name || 'latest' }}
            type=sha,format=long
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
