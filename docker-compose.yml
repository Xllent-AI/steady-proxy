# Production: start the self-healing proxy in front of your real gateway.
#
#   cp .env.example .env   # set PROXY_UPSTREAM_URL to your real gateway (untracked)
#   docker compose up -d --build
#   # then set ANTHROPIC_BASE_URL=http://127.0.0.1:8789 in ~/.claude/settings.json,
#   # and CLAUDE_CODE_CONNECT_TIMEOUT_MS=660000 (must exceed PROXY_KEEPALIVE_MS).
#
services:
  proxy:
    build:
      context: .
      args:
        VERSION: "${PROXY_VERSION:-}"
        COMMIT: "${PROXY_COMMIT:-}"
        BUILD_DATE: "${PROXY_BUILD_DATE:-}"
        DIRTY: "${PROXY_DIRTY:-unknown}"
    image: cc-retry-proxy:latest
    # Run as the host user so PROXY_REQUEST_LOG_DIR dumps are owned by you, not
    # root (readable without sudo). Falls back to 1000:1000; override by exporting
    # UID/GID or setting them in .env if your host user differs.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PROXY_LISTEN_ADDR: "0.0.0.0:8789"
      PROXY_UPSTREAM_URL: "${PROXY_UPSTREAM_URL:-https://your-gateway.example.com}"
      PROXY_SDK_RETRY_CAP: "${PROXY_SDK_RETRY_CAP:-100}" # backstop only; Claude Code still has its own retry cap
      PROXY_TRANSACTIONAL_LOCAL_RETRIES: "${PROXY_TRANSACTIONAL_LOCAL_RETRIES:-0}"
      PROXY_LOCAL_RETRY_EXTRA_BACKOFF_CAP_MS: "${PROXY_LOCAL_RETRY_EXTRA_BACKOFF_CAP_MS:-10000}"
      PROXY_KEEPALIVE_MS: "${PROXY_KEEPALIVE_MS:-600000}"
      PROXY_WORKFLOW_KEEPALIVE_MS: "${PROXY_WORKFLOW_KEEPALIVE_MS:-10000}" # workflow agents only: SMALL window — commit early + stream live so forwarded deltas feed their ~180s per-agent stall watchdog. Keep small: while buffering nothing is forwarded, so the first gap (~= window + TTFB) must stay under stallMs. A content-silent pause >= stallMs is unfixable here (raise the workflow's stallMs instead).
      PROXY_UPSTREAM_BYTE_IDLE_MS: "${PROXY_UPSTREAM_BYTE_IDLE_MS:-600000}"
      PROXY_VALIDATE_JSON: "${PROXY_VALIDATE_JSON:-1}"
      PROXY_NORMALIZE_TOOL_JSON: "${PROXY_NORMALIZE_TOOL_JSON:-1}"
      PROXY_REFUSAL_FALLBACK_MODEL: "${PROXY_REFUSAL_FALLBACK_MODEL-claude-opus-4-8}"
      PROXY_REQUEST_LOG_DIR: "${PROXY_REQUEST_LOG_DIR:-}"
      PROXY_REQUEST_LOG_MAX_BYTES: "${PROXY_REQUEST_LOG_MAX_BYTES:-10485760}"
      PROXY_VERBOSE: "${PROXY_VERBOSE:-1}"
    volumes:
      - ./logs:/logs
    ports:
      - "127.0.0.1:8789:8789" # loopback only — never expose publicly
    restart: unless-stopped
